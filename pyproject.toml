[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-book-importer"
version = "0.1.0"
description = "Reusable CLI for scanning source ebook folders, comparing to a Calibre library, and adding missing formats such as AZW3"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tomrb" }]
license = { text = "MIT" }

[project.scripts]
calibre-book-importer = "calibre_book_importer.cli:main"

[tool.setuptools]
packages = ["calibre_book_importer"]
